<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>StudySync - Sesiones</title>
</head>
<body>

  <h2>📚 Sesiones disponibles</h2>

  <button onclick="cargar()">Cargar sesiones</button>

  <div id="lista"></div>

  <script>
    async function cargar() {
      const res = await fetch("http://localhost:3000/api/sesiones");
      const data = await res.json();

      const lista = document.getElementById("lista");
      lista.innerHTML = "";

      data.forEach(s => {
        lista.innerHTML += `
          <div>
            <h3>${s.titulo}</h3>
            <p>${s.materia}</p>
            <button onclick="entrar(${s.id})">Entrar</button>
          </div>
          <hr>
        `;
      });
    }

    function entrar(id) {
      localStorage.setItem("sesionId", id);
      window.location.href = "chat.html";
    }
  </script>

</body>
</html>
